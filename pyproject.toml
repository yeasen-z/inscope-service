[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inscope"
version = "0.5.0"
description = "InScope core service: activation-based IPI detection over sglang-inscope"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
# 只装客户端（coolwatch 等调用方）：不会拖进 torch / fastapi。
#   pip install inscope
# 服务端：
#   pip install inscope[server]
server = [
    "fastapi",
    "uvicorn",
    "torch",
    "transformers",
]
dev = [
    "pytest",
]

[project.scripts]
inscope-serve = "inscope_server.cli:main"

[tool.setuptools.packages.find]
include = ["inscope", "inscope_contract*", "inscope_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
